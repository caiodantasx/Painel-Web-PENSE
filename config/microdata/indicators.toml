# Indicadores calculados a partir dos microdados (escolares de 13 a 17 anos).
#
# Cada indicador define numerador e denominador por códigos de resposta. Com `any`, a
# condição vale se QUALQUER uma das variáveis atender (ex.: cinto no banco da frente OU
# de trás). Os códigos seguem o questionário; o prefixo "V" de 2015 é tratado pela edição.
#
# `editions` lista onde a variável existe COM O MESMO CÓDIGO. Pela convenção do IBGE
# (Nota metodológica n. 01, 2015), código igual = mesma redação de pergunta e opções; um
# sufixo novo ("A", "B") indica pergunta alterada. Por isso B09011A (2019/2024) não é a
# VB09011 de 2015, e não entra na mesma série.
#
# `published` aponta a tabela publicada usada para validar o cálculo (família e categoria).
# Fonte das regras de 2015: Nota metodológica n. 03 (tabelas 2.11.x).

[TRAJETO_INSEGURO]
label = "Faltaram à escola por falta de segurança no trajeto casa-escola"
period = "30_DIAS"
question = "NOS ÚLTIMOS 30 DIAS, em quantos dias você deixou de ir à escola porque não se sentia seguro no caminho de casa para a escola ou da escola para casa?"
var = "B09001"
num = [2, 3, 4, 5, 6]
den = [1, 2, 3, 4, 5, 6]
editions = ["PENSE_2015_A2", "PENSE_2019", "PENSE_2024"]
published = { PENSE_2019 = "9.7", PENSE_2024 = "9.7", PENSE_2015_A2 = "2.11.1" }

[ESCOLA_INSEGURA]
label = "Faltaram à escola por falta de segurança na escola"
period = "30_DIAS"
question = "NOS ÚLTIMOS 30 DIAS, em quantos dias você não foi à escola porque não se sentia seguro na escola?"
var = "B09002"
num = [2, 3, 4, 5, 6]
den = [1, 2, 3, 4, 5, 6]
editions = ["PENSE_2015_A2", "PENSE_2019", "PENSE_2024"]
published = { PENSE_2019 = "9.8", PENSE_2024 = "9.8", PENSE_2015_A2 = "2.11.2" }

[CINTO_NUNCA_RARAMENTE]
label = "Nunca ou raramente usaram cinto de segurança (banco da frente ou de trás)"
period = "30_DIAS"
question = "Uso do cinto como passageiro no banco da frente (B09006A1) e no banco de trás (B09006A2); exclui quem não andou nesse tipo de veículo."
any = [{ var = "B09006A1", num = [2, 3], den = [2, 3, 4, 5, 6] }, { var = "B09006A2", num = [2, 3], den = [2, 3, 4, 5, 6] }]
editions = ["PENSE_2015_A2", "PENSE_2019", "PENSE_2024"]
published = { PENSE_2019 = "9.1", PENSE_2024 = "9.1", PENSE_2015_A2 = "2.11.3" }

[CINTO_FRENTE]
label = "Nunca ou raramente usaram cinto no banco da frente"
period = "30_DIAS"
question = "NOS ÚLTIMOS 30 DIAS, com que frequência você usou cinto de segurança enquanto andava como passageiro(a) NO BANCO DA FRENTE de carro/automóvel, van ou táxi?"
var = "B09006A1"
num = [2, 3]
den = [2, 3, 4, 5, 6]
editions = ["PENSE_2015_A2", "PENSE_2019", "PENSE_2024"]
published = { PENSE_2019 = "9.2|Banco da frente", PENSE_2024 = "9.2|Banco da frente", PENSE_2015_A2 = "2.11.4|Banco da frente" }

[CINTO_TRAS]
