# Capacete: a MESMA pergunta (B09007A) foi publicada com definições diferentes.
#   2015 (Nota n. 03, tabela 2.11.5): numerador = às vezes, na maior parte do tempo, sempre (4, 5, 6).
#   2024 (tabela 9.3): numerador = raramente a sempre (3 a 6) — reproduz 87,9056% (Brasil).
# Os microdados permitem calcular as duas definições nas três edições; cada série usa uma só.
[CAPACETE_QUALQUER_USO]
label = "Usaram capacete (de raramente a sempre), dentre os que andaram de motocicleta"
period = "30_DIAS"
question = "NOS ÚLTIMOS 30 DIAS, com que frequência você usou capacete ao andar de motocicleta?"
var = "B09007A"
num = [3, 4, 5, 6]
den = [2, 3, 4, 5, 6]
editions = ["PENSE_2015_A2", "PENSE_2019", "PENSE_2024"]
published = { PENSE_2019 = "9.3", PENSE_2024 = "9.3" }
definition_note = "Definição das tabelas 9.3 de 2019 e de 2024 (confirmada pelos microdados). Difere da definição publicada em 2015 (às vezes a sempre)."

