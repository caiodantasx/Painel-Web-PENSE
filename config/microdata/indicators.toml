published = { PENSE_2015_A2 = "2.11.5" }
definition_note = "Definição da tabela 2.11.5 de 2015 (Nota metodológica n. 03). As tabelas 9.3 de 2019 e de 2024 usam a outra definição (raramente a sempre), conferido pelos microdados."
series_exclude = "Fora da série: só 2015 publicou esta definição; em 2019 e 2024 não há tabela para validar a estimativa. Volta à série apenas com validação documental das três edições e decisão registrada."

