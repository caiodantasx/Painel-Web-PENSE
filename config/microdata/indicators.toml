# ---- 9º ano do ensino fundamental (todas as idades): extensão da série oficial 2009–2019 ----
# indirect_validation: o IBGE não publicou tabela do 9º ano para 2024. A edição de 2024 conta como
# "validação indireta" quando os indicadores listados (mesma variável e mesmo denominador, 13 a 17 anos)
# reproduzem as tabelas de 2024. Pontos com validação indireta aparecem como "calculado, não oficial".
# 2015 (Amostra 1) é validada DIRETAMENTE contra a série oficial, na convenção de não resposta da série.
# 2009, 2012 e 2015 ficam com os valores OFICIAIS da série: a regra harmonizada do IBGE para esses anos
# não foi reproduzida pelos microdados (ver reports/tentativa_microdados_2009_2012_2015A1.csv e
# docs/12_microdados.md). 2019 reproduz a série oficial exatamente; 2024 estende com a mesma regra.
# O IBGE publicou indicadores comparáveis do 9º ano nas capitais para 2009, 2012, 2015 e 2019
# (pasta 2009_2019_indicadores_comparaveis_9ano, Tema 10). Os mesmos indicadores são
# recalculados com os microdados de 2019 (validação contra a tabela oficial) e de 2024
# (extensão da série). Universo: turmas do 9º ano (ANO_TURMA = 3), sem filtro de idade.

