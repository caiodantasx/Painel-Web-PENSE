# Fontes oficiais das tabelas da PeNSE (IBGE) usadas pelo painel.
#
# O IBGE coloca a data de atualização no nome dos arquivos
# (ex.: Tema_09_Seguranca_XLSX_20260525.zip). Por isso cada tema é
# localizado por um padrão (regex) na listagem do diretório, e não por um
# nome fixo. Se o IBGE publicar uma versão corrigida, o script pega a nova
# automaticamente e o manifesto registra qual arquivo foi usado.
#
# "fallback" é o nome conferido em 18/10/2026, usado só se a listagem do
# diretório não puder ser lida.

edicoes:
  "2019":
    base_url: "https://ftp.ibge.gov.br/pense/2019/xls/"
    temas:
      guia:
        descricao: "Guia das tabelas (índice do plano tabular)"
        padrao: '^Guia_Tabelas_PeNSE_2019_\d{8}\.xls$'
        fallback: "Guia_Tabelas_PeNSE_2019_20260615.xls"
      tema_02:
        descricao: "Situações em casa e na escola (bullying, faltas por insegurança)"
        padrao: '^Tema_02_Situacoes_em_Casa_e_na_Escola_\d{8}\.xls$'
        fallback: "Tema_02_Situacoes_em_Casa_e_na_Escola_20260615.xls"
      tema_09:
        descricao: "Segurança (brigas, armas, agressão, violência sexual)"
        padrao: '^Tema_09_Seguranca_\d{8}\.xls$'
        fallback: "Tema_09_Seguranca_20260615.xls"
      tema_17:
        descricao: "Segurança da escola (questionário do gestor escolar)"
        padrao: '^Tema_17_Seguranca_da_Escola_\d{8}\.xls$'
        fallback: "Tema_17_Seguranca_da_Escola_20260615.xls"

  "2024":
    base_url: "https://ftp.ibge.gov.br/pense/2024/xlsx/"
    temas:
      guia:
        descricao: "Guia das tabelas (índice do plano tabular)"
        padrao: '^Guia_Tabelas_PeNSE_2024_\d{8}\.xlsx$'
        fallback: "Guia_Tabelas_PeNSE_2024_20260525.xlsx"
      tema_02:
        descricao: "Situações em casa e na escola (bullying, faltas por insegurança)"
        padrao: '^Tema_02_Situacoes_em_Casa_e_na_Escola_XLSX_\d{8}\.zip$'
        fallback: "Tema_02_Situacoes_em_Casa_e_na_Escola_XLSX_20260525.zip"
      tema_09:
        descricao: "Segurança (brigas, armas, agressão, violência sexual)"
        padrao: '^Tema_09_Seguranca_XLSX_\d{8}\.zip$'
        fallback: "Tema_09_Seguranca_XLSX_20260525.zip"
      tema_17:
        descricao: "Segurança da escola (questionário do gestor escolar)"
        padrao: '^Tema_17_Seguranca_da_Escola_XLSX_\d{8}\.zip$'
        fallback: "Tema_17_Seguranca_da_Escola_XLSX_20260525.zip"
